name: Auto Update Draft Cases

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: write

jobs:
  update-draft-cases:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh source candidates
        run: npm run refresh:sources

      - name: Generate draft cases
        run: npm run generate:draft-cases

      - name: Run tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Commit generated updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/candidates/latest-candidates.json src/data/autoDraftCases.js
          if git diff --cached --quiet; then
            echo "No generated case updates to commit."
          else
            git commit -m "chore: auto-update draft cases"
            git push
          fi
